global
    maxconn 2000

defaults
    mode http
    timeout connect 5000ms
    timeout client  50000ms
    timeout server  50000ms

frontend http_front
    bind *:80
    default_backend web_backend

backend web_backend
    balance roundrobin
    server backend1 backend1:5000 check inter 2000ms fall 2 rise 2
    server backend2 backend2:5000 check inter 2000ms fall 2 rise 2
    server backend3 backend3:5000 check inter 2000ms fall 2 rise 2

listen stats
    bind *:8404
    stats enable
    stats uri /stats
    stats refresh 5s

